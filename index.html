<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>IRON 28 PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, barra de abas fixa embaixo, cartões escuros com aço escovado. Visual único escuro, por escolha. */
:root{
  --bg:#101010; --surface:#18181a; --surface2:#202023; --line:#2c2c30;
  --steel:#9a9ea6; --steel-hi:#c9ccd2; --fg:#f5f5f6; --muted:#8a8c92;
  --red:#C71920; --red-hi:#e5262e; --red-dim:#3a0d10;
  --green:#22c55e; --green-dim:#0f2b19;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --tab-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(180deg,#f2f3f5 0%,#a7abb2 55%,#e6e8eb 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand b{color:var(--red);-webkit-text-fill-color:var(--red)}
.pill{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--steel)}
.pill.red{border-color:var(--red);color:var(--red-hi)}
.pill.green{border-color:var(--green);color:var(--green)}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
.lbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Hero do próximo treino */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px;background:
  radial-gradient(120% 90% at 100% 0%,rgba(199,25,32,.35),transparent 60%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),
  linear-gradient(160deg,#1d1d20,#121213);border:1px solid #33262a}
.hero .letter{position:absolute;right:-6px;top:-34px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:170px;line-height:1;color:var(--red);opacity:.85;text-shadow:0 0 40px rgba(199,25,32,.35);pointer-events:none}
.hero h1{font-size:40px;font-weight:800;font-style:italic;line-height:.95;max-width:70%}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--steel-hi);font-size:15px;max-width:68%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;width:100%}
.btn-red{background:linear-gradient(180deg,var(--red-hi),var(--red));color:#fff;box-shadow:0 6px 24px rgba(199,25,32,.35)}
.btn-red:active{transform:translateY(1px)}
.btn-ghost{border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:18px;min-height:48px}
.btn-green{background:var(--green);color:#04130a}
.hero .btn{margin-top:18px;position:relative}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.stat .v small{font-size:16px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red-hi))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.badge{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:22px;font-style:italic}
.badge.red{background:var(--red-dim);border-color:var(--red);color:var(--red-hi)}
.badge.green{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{border-left:3px solid var(--steel);padding:2px 0 2px 12px;color:var(--steel-hi);font-size:15px}

/* Sessão */
.sess-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.done{border-color:#1f5134}
.ex.cur{border-color:var(--red)}
.ex-h{display:flex;gap:12px;align-items:center;padding:14px;width:100%;text-align:left}
.ex-h .nm{font-weight:700;font-size:17px;line-height:1.2}
.ex-h .rx{font-size:14px;color:var(--steel);margin-top:2px}
.ex-b{padding:0 14px 14px}
.media{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface2);border:1px dashed #3a3a40;width:100%;text-align:left;margin-bottom:12px}
.media .thumb{flex:none;width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,#2a2a2e,#151517);display:grid;place-items:center}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:0 4px 6px}
.sets td{padding:5px 4px;vertical-align:middle}
.sets .sn{font-family:var(--f-display);font-weight:800;font-size:20px;width:28px;color:var(--steel)}
.sets .prev{font-size:14px;color:var(--steel);white-space:nowrap}
.sets .prev em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.sets .prev em.up{color:var(--green)}
.sets .prev em.down{color:var(--red-hi)}
.sets input{width:100%;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:#0c0c0d;text-align:center;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:#5f6168;font-weight:600}
.sets tr.ok input{border-color:#1f5134;background:var(--green-dim)}
.chk{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.chk.on{background:var(--green);border-color:var(--green);color:#04130a}
.sob{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 6px 32px;font-size:13px;color:var(--muted)}
.sob button{padding:4px 9px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--steel-hi)}
.sob button.on{border-color:var(--red);background:var(--red-dim);color:#fff}
.stop{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#0c0c0d;border:1px solid var(--line);margin-bottom:10px}
.stop b{display:block;font-size:15px}
.stop span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:12px;height:22px;border-radius:4px;background:var(--red)}
.dots i.r{background:transparent;border:2px dashed var(--green)}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.links button,.links a{color:var(--steel-hi);text-decoration:underline;text-underline-offset:3px}

/* Cronômetro */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,#1b0b0c,#120708);border-top:1px solid var(--red)}
.timer .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;min-width:96px}
.timer.over{background:linear-gradient(180deg,#0f2b19,#09170e);border-top-color:var(--green)}
.timer.over .t{color:var(--green)}
.timer .tb{padding:10px 10px;min-width:44px;border-radius:10px;border:1px solid #4a2226;font-weight:700}
.timer.over .tb{border-color:#1f5134}

/* Abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(12,12,13,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
nav.tabs button.on{color:var(--fg)}
nav.tabs button.on svg{color:var(--red-hi)}
nav.tabs svg{width:24px;height:24px}

/* Folha (biblioteca / diálogos) */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vid{aspect-ratio:16/10;max-width:100%;border-radius:14px;background:repeating-linear-gradient(135deg,#1c1c1f 0 12px,#18181a 12px 24px);border:1px dashed #3a3a40;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;padding:16px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;border-radius:14px;overflow:hidden;border:2px solid}
.cmp figure.ok{border-color:var(--green)}
.cmp figure.bad{border-color:var(--red)}
.cmp .vid.sm{aspect-ratio:3/4;border:0;border-radius:0;padding:0}
.slot{position:relative;aspect-ratio:200/260;background:#121214}
.slot video,.slot img{display:block;width:100%;height:100%;object-fit:cover}
.slot .tag{position:absolute;left:6px;top:6px;padding:3px 8px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:14px}
.slot .tag.ok{background:var(--green);color:#04130a}
.slot .tag.bad{background:var(--red);color:#fff}
.slot .rm{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.real{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.slot.wide{aspect-ratio:9/12}
.addbig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:2px dashed #3a3a40;border-radius:14px;text-align:center;padding:16px}
.addv{display:block;padding:9px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;background:#0c0c0d;border-top:1px solid var(--line)}
.cmp svg.anim{display:block;width:100%;height:100%;background:radial-gradient(90% 70% at 50% 40%,#1e1e22,#121214)}
.cmp figcaption small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;text-transform:none;opacity:.85;margin-top:2px}
.cmp figcaption{padding:8px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase}
.cmp .ok figcaption{background:var(--green-dim);color:var(--green)}
.cmp .bad figcaption{background:var(--red-dim);color:#ffd0d2}
.cue{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:15px}
.cue.ok{background:var(--green-dim);color:#c9f5d8}
.cue.bad{background:var(--red-dim);color:#ffd0d2}
.cue b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.cue.ok b{background:var(--green);color:#04130a}
.cue.bad b{background:var(--red);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{height:48px;border-radius:10px;border:1px solid var(--line);background:#0c0c0d;padding:0 12px;font-size:17px;width:100%}
textarea{height:140px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-weight:800;font-size:20px}
.seg button.on{border-color:var(--red);background:var(--red-dim)}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600}
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filter button{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--steel-hi)}
.filter button.on{border-color:var(--red);color:#fff;background:var(--red-dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<script>
/* ============================================================
   PROTOCOLO — dados fáceis de trocar (v1.1, proposta NÃO aprovada)
   Formato de cada exercício: [id, séries, repsMín, repsMáx, descanso(s), sobrar, dupla?]
   ============================================================ */
const PROTO_BASE = {
  versao: "v1.2",
  sequencia: ["A","B","C","D"],
  extra: "E",
  primeiro: "B",
  treinos: {
    A:{nome:"Superior 1",foco:"Peito e costas",min:60,ex:[
      ["supino_guiado",3,6,10,150,"1–2"],["puxada_aberta",3,8,12,120,"1–2"],["supino_incl_guiado",3,8,12,120,"1–2"],
      ["remada_baixa",3,8,12,120,"1–2"],["lateral_cabo",3,12,20,0,"0–1"],["triceps_v",3,10,15,0,"0–1","A6"],["rosca_w",3,10,15,75,"0–1","A6"]]},
    B:{nome:"Inferior 1",foco:"Frente da coxa",min:60,ex:[
      ["agachamento_guiado",3,6,10,150,"1–2"],["leg_press",3,10,15,120,"1–2"],["extensora",3,12,15,90,"0–1"],
      ["flexora",3,10,15,90,"0–1"],["adutora",2,12,15,75,"1"],["panturrilha_lp",3,10,15,75,"0–1"],["abd_reverso",2,10,15,60,"1"]]},
    C:{nome:"Superior 2",foco:"Costas e ombros",min:60,ex:[
      ["remada_unilateral",3,8,12,90,"1–2"],["supino_halter",3,8,12,120,"1–2"],["puxada_triangulo",3,8,12,120,"1–2"],
      ["crucifixo_cabo",2,12,15,75,"0–1"],["voador_inverso",3,12,20,0,"0–1","C5"],["lateral_halter",3,12,20,75,"0–1","C5"],
      ["martelo_corda",2,10,15,0,"0–1","C6"],["triceps_cabeca",2,10,15,75,"0–1","C6"]]},
    D:{nome:"Inferior 2",foco:"Posterior e glúteos",min:60,ex:[
      ["stiff",3,6,10,150,"1–2"],["elevacao_pelvica",3,8,12,120,"1–2"],["leg_press_alto",3,10,12,120,"1–2"],["flexora",3,10,15,90,"0–1"],
      ["extensora",2,12,15,90,"0–1"],["abdutora",2,15,20,60,"1"],["panturrilha_lp",3,10,15,75,"0–1"],["prancha",2,30,45,60,"—"]]},
    E:{nome:"Extra opcional",foco:"Ombros, braços e trapézio",min:35,ex:[
      ["lateral_cabo",3,12,20,0,"0–1"],["face_pull",2,12,15,75,"0–1"],["encolhimento",2,10,15,90,"1"],
      ["rosca_w",2,8,12,0,"0–1","E4"],["triceps_testa",2,8,12,90,"0–1","E4"]]}
  }
};

let PROTOCOLO = PROTO_BASE;
/* Biblioteca: u = unidade, inc = menor aumento (null = 1 placa), lado = um lado por vez */
const EXS = {
  supino_guiado:{anim:"supino",okTag:"Barra no meio do peito · peito",badTag:"Quadril sai do banco · quica",n:"Supino reto na Smith (barra guiada)",m:"Peito",e:"Barra guiada",u:"kg",inc:4,ok:["Escápulas juntas e para baixo, peito alto","Barra desce na linha do meio do peito","Pés firmes no chão"],bad:["Cotovelos abertos a 90° do corpo","Quicar a barra no peito","Tirar o quadril do banco"]},
  puxada_aberta:{anim:"puxada",okTag:"Cotovelos para baixo · costas",badTag:"Joga o tronco para trás",n:"Puxada alta pela frente, pegada aberta",m:"Costas",e:"Puxada alta",u:"placa",inc:null,ok:["Puxe com os cotovelos para baixo e para trás","Barra até a parte de cima do peito","Suba controlando até esticar os braços"],bad:["Jogar o tronco para trás para roubar","Puxar atrás da nuca","Encolher os ombros"]},
  supino_incl_guiado:{anim:"supino_incl",okTag:"Banco a 30° · parte de cima do peito",badTag:"Banco em pé demais · vira ombro",n:"Supino inclinado na Smith (~30°)",m:"Peito",e:"Barra guiada + banco",u:"kg",inc:4,ok:["Banco a cerca de 30°","Barra desce na parte de cima do peito","Escápulas firmes no banco"],bad:["Banco muito inclinado (vira ombro)","Descer sem controle","Arquear demais a lombar"]},
  remada_baixa:{anim:"remada_baixa",okTag:"Tronco firme · costas",badTag:"Balança o tronco · coluna curva",n:"Remada baixa com triângulo",m:"Costas",e:"Remada baixa",u:"placa",inc:null,ok:["Tronco firme, peito aberto","Leve o triângulo até a barriga","Junte as escápulas no fim"],bad:["Balançar o tronco para frente e para trás","Arredondar as costas","Puxar só com os braços"]},

function gerarPlano(p){
  const idoso=(+p.idade||0)>=60, ini=p.nivel==="ini", lim=p.lim||[], dias=+p.dias||4;
  if(dias===4 && !ini && !idoso && !lim.length && p.objetivo!=="saude") return null;   // = protocolo IRON 28 v1.2 aprovado
  const pl = JSON.parse(JSON.stringify(dias<=3 ? FULL3 : PROTO_BASE));
  if(dias>=5 && pl.treinos.E){ pl.sequencia=["A","B","C","D","E"]; pl.treinos.E.nome="Ombros e braços"; }
  if(dias<5) delete pl.treinos.E;
  pl.primeiro = pl.sequencia.includes("B") && dias>=4 ? "B" : "A";
  const tirar = new Set([...(idoso?TIRA.idoso:[]), ...lim.flatMap(l=>TIRA[l]||[])]);
  for(const T of Object.values(pl.treinos)){
    const usados = new Set(T.ex.map(a=>a[0]));
    T.ex = T.ex.filter(a=>{
      if(!tirar.has(a[0])) return true;
      const cand=[...((idoso&&PREF_IDOSO[a[0]])||[]), ...(ALT[a[0]]||[])].find(c=>!usados.has(c)&&!tirar.has(c));
      if(!cand) return false;
      usados.delete(a[0]); usados.add(cand); a[0]=cand; return true;
    });
    T.ex.forEach(a=>{
      if(ini||idoso||p.objetivo==="saude"){ a[1]=Math.max(2,a[1]-1); if(a[5]!=="—") a[5]="2–3"; if(a[2]<8 && a[5]!=="—"){ a[2]=8; a[3]=Math.max(a[3],12); } }
      if(idoso){ a[1]=Math.min(a[1],2); if(a[4]>=90) a[4]+=30; }
    });
    T.min = Math.round(T.ex.reduce((m,a)=>m+a[1]*(1+(a[4]||40)/60),8));
  }
  pl.versao = "Gerado: "+dias+" dias · "+(idoso?"60+":NIVEIS[p.nivel]||"")+(lim.length?" · com limitação":"");
  return pl;
}

/* ===== Recorte da foto: círculo, pinça para zoom e arrastar ===== */
function abrirRecorte(file){
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    const V=Math.min(300, window.innerWidth-48), w=img.naturalWidth, h=img.naturalHeight, s0=Math.max(V/w,V/h);
    const st={z:1,tx:0,ty:0};
    const ov=document.createElement("div"); ov.id="crop";
    ov.style.cssText="position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px";
    ov.innerHTML=`<b style="font-size:18px">Ajuste sua foto</b><div class="small muted">Arraste para centralizar · use dois dedos para zoom</div>
      <div id="cropV" style="position:relative;width:${V}px;height:${V}px;overflow:hidden;touch-action:none;border-radius:14px;background:#000">
        <img id="cropI" src="${url}" draggable="false" style="position:absolute;left:50%;top:50%;width:${w}px;height:${h}px;max-width:none;transform-origin:center;user-select:none;-webkit-user-select:none;pointer-events:none">
        <div style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.6);border:2px dashed #fff;pointer-events:none"></div>
      </div>
      <input id="cropZ" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom" style="width:${V}px">
      <div class="row" style="gap:10px;width:${V}px"><button class="btn btn-ghost" id="cropNo" style="flex:1">Cancelar</button><button class="btn btn-red" id="cropOk" style="flex:1">Salvar foto</button></div>`;
    document.body.appendChild(ov);
    const el=ov.querySelector("#cropI"), vp=ov.querySelector("#cropV"), zr=ov.querySelector("#cropZ");
    const lim=()=>{ const sc=s0*st.z, mx=Math.max(0,(w*sc-V)/2), my=Math.max(0,(h*sc-V)/2); st.tx=Math.max(-mx,Math.min(mx,st.tx)); st.ty=Math.max(-my,Math.min(my,st.ty)); };
    const draw=()=>{ lim(); el.style.transform=`translate(-50%,-50%) translate(${st.tx}px,${st.ty}px) scale(${s0*st.z})`; zr.value=st.z; };
    draw();
    const pts=new Map(); let ini=null;
    const snap=()=>{ const a=[...pts.values()]; ini={z:st.z,tx:st.tx,ty:st.ty,a:a.map(p=>({...p})),d:a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0,m:a.length>1?{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}:{...a[0]}}; };
    vp.addEventListener("pointerdown",e=>{ vp.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); snap(); e.preventDefault(); });
    vp.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)||!ini) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const a=[...pts.values()];
      if(a.length>1 && ini.d){ const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; const nz=Math.max(1,Math.min(4,ini.z*d/ini.d)), k=nz/ini.z;
        st.z=nz; st.tx=ini.tx*k+(m.x-ini.m.x); st.ty=ini.ty*k+(m.y-ini.m.y); }
      else { st.tx=ini.tx+(a[0].x-ini.m.x); st.ty=ini.ty+(a[0].y-ini.m.y); }
      draw(); e.preventDefault(); });
    const up=e=>{ pts.delete(e.pointerId); if(pts.size) snap(); else ini=null; };
    vp.addEventListener("pointerup",up); vp.addEventListener("pointercancel",up);
    vp.addEventListener("wheel",e=>{ const nz=Math.max(1,Math.min(4,st.z*(e.deltaY<0?1.08:0.92))), k=nz/st.z; st.z=nz; st.tx*=k; st.ty*=k; draw(); e.preventDefault(); },{passive:false});
    zr.addEventListener("input",()=>{ const nz=+zr.value, k=nz/st.z; st.z=nz; st.tx*=k; st.ty*=k; draw(); });
    const fecha=()=>{ ov.remove(); URL.revokeObjectURL(url); };
    ov.querySelector("#cropNo").onclick=fecha;
    ov.querySelector("#cropOk").onclick=()=>{ const O=240, c=document.createElement("canvas"); c.width=c.height=O; const x=c.getContext("2d");
      x.fillStyle="#111"; x.fillRect(0,0,O,O); x.translate(O/2,O/2); x.scale(O/V,O/V); x.translate(st.tx,st.ty); x.scale(s0*st.z,s0*st.z); x.drawImage(img,-w/2,-h/2);
      const u=c.toDataURL("image/jpeg",.85); fecha(); window._fotoTmp=u; const f=$("#cadFoto"); if(f) f.innerHTML=`<img src="${u}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--red)">`; toast("Foto ajustada. Toque em Salvar."); };
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); toast("Não deu para abrir a foto"); };
  img.src=url;
}

function fotoReduzida(file){ return new Promise((ok,no)=>{ const img=new Image(), url=URL.createObjectURL(file); img.onload=()=>{ const s=240, c=document.createElement("canvas"); c.width=c.height=s; const r=Math.min(img.width,img.height); c.getContext("2d").drawImage(img,(img.width-r)/2,(img.height-r)/2,r,r,0,0,s,s); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",.8)); }; img.onerror=no; img.src=url; }); }

const DIAS_SEM=["dom","seg","ter","qua","qui","sex","sáb"];
function relatorio(dias){
  const ini = dias ? Date.now()-dias*864e5 : 0, fim=Date.now();
  const ses = S.sessoes.filter(s=>s.status==="feito" && s.inicio>=ini).sort((a,b)=>a.inicio-b.inicio);
  const durs = ses.filter(s=>s.fim).map(s=>s.fim-s.inicio);
  const tMed = durs.length ? durs.reduce((a,b)=>a+b,0)/durs.length : 0;
  const span = Math.max(7, (fim-Math.max(ini, ses[0]?.inicio||fim))/864e5);
  const porMusc={}, sob=[]; let series=0, volKg=0;
  const evo={};
  for(const s of ses) for(const [id,r] of Object.entries(s.log)){ const x=EXS[id]; if(!x) continue;
    const fs=(r.sets||[]).filter(z=>z.feito); if(!fs.length) continue;
    porMusc[x.m]=(porMusc[x.m]||0)+fs.length; series+=fs.length;
    fs.forEach(z=>{ if(z.sob!=null) sob.push(+z.sob); if((x.u==="kg"||x.u==="kg/halter")&&z.kg&&z.reps) volKg+=z.kg*z.reps*(x.u==="kg/halter"?2:1); });
    if(x.u!=="rep"&&x.u!=="seg"){ const best=fs.reduce((b,z)=>(!b||z.kg>b.kg||(z.kg===b.kg&&z.reps>b.reps))?z:b,null); (evo[id]=evo[id]||[]).push({d:s.inicio,kg:best.kg,reps:best.reps}); }
  }
  const sono=(S.sono||[]).filter(x=>x.t>=ini).map(x=>x.h), pesos=(S.corpo||[]).filter(x=>x.d>=ini&&x.peso).sort((a,b)=>a.d-b.d);
  const card=(S.cardio||[]).filter(x=>x.t>=ini);
  return {ses,tMed,freq:ses.length/span*7,porMusc,series,volKg,evo,sob,sono,pesos,card,dias};
}

function anterior(exId, excluir){
  for(let i=S.sessoes.length-1;i>=0;i--){
    const s=S.sessoes[i]; if(s.id===excluir) continue;

  }

}
function sugestao(ex, i, prev, atual){
  const lib = EXS[ex.id];
  if(atual && i>0){ const sa=atual[i-1]; if(sa&&sa.feito&&sa.reps<=ex.min-3){
    if(lib.inc===null) return {kg:sa.kg, reps:ex.min, txt:"▼ −1 placa", up:false, down:true};
    if(lib.inc && sa.kg) return {kg:Math.max(0,sa.kg-lib.inc), reps:ex.min, txt:"▼ −"+lib.inc+" kg", up:false, down:true};
  } }
  if(!prev) return null;
  const p = prev.sets[i] || prev.sets.filter(x=>x.feito).slice(-1)[0];
  if(!p || !p.feito) return null;
  const kg = p.kg;
  if(p.reps >= ex.max){
    if(lib.inc) return {kg: kg+lib.inc, reps: ex.min, txt:"▲ +"+lib.inc+(lib.u==="kg/halter"?" kg/halter":" kg"), up:true};
    if(lib.inc===null) return {kg, reps: ex.min, txt:"▲ +1 placa", up:true};
    return {kg, reps: p.reps+1, txt:"▲ +1 rep", up:true};
  }
  if(p.reps < ex.min) return {kg, reps: ex.min, txt:"manter ou reduzir", up:false};

}

const DB = { db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((ok,no)=>{ try{ const r=indexedDB.open("iron28pro-midia",1); r.onupgradeneeded=()=>r.result.createObjectStore("m"); r.onsuccess=()=>{this.db=r.result;ok(this.db)}; r.onerror=()=>no(r.error);}catch(e){no(e)} }); },
  async get(k){ const d=await this.open(); return new Promise(ok=>{const q=d.transaction("m").objectStore("m").get(k); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>ok(null);}); },
  async put(k,v){ const d=await this.open(); return new Promise((ok,no)=>{const t=d.transaction("m","readwrite"); t.objectStore("m").put(v,k); t.oncomplete=ok; t.onerror=()=>no(t.error);}); },
  async del(k){ const d=await this.open(); return new Promise(ok=>{const t=d.transaction("m","readwrite"); t.objectStore("m").delete(k); t.oncomplete=ok;}); }
};
let urls=[];
async function carregaMidia(id){
  urls.forEach(u=>URL.revokeObjectURL(u)); urls=[];
  for(const m of ["real"]){
    let b=null; try{ b=await DB.get(id+":"+m); }catch(e){}
    const slot=document.getElementById("slot-"+m), lbl=document.getElementById("lbl-"+m); if(!slot) continue;
    if(b){ const u=URL.createObjectURL(b); urls.push(u);
      slot.innerHTML = (b.type||"").startsWith("image/") ? `<img src="${u}" alt="">` : `<video src="${u}" autoplay muted loop playsinline></video>`;
      slot.insertAdjacentHTML("beforeend",`<button class="rm" data-act="rmMidia" data-k="${id}:${m}" aria-label="Remover vídeo">✕</button>`);
    }
  }
}

function recordes(){
  const out=[];
  for(const [id,x] of Object.entries(EXS)){
    if(x.u==="rep"||x.u==="seg") continue;
    let best=null; for(const s of S.sessoes){ for(const z of (s.log[id]?.sets||[])) if(z.feito && (!best || z.kg>best.kg || (z.kg===best.kg && z.reps>best.reps))) best={...z,d:s.inicio}; }
    if(best) out.push(`<div class="li small"><span class="grow ellip">${esc(x.n)}</span><b class="num">${best.kg} × ${best.reps}</b></div>`);
  }
  return out.join("") || `<p class="muted small">Aparecem depois do primeiro treino.</p>`;
}
function grafico(pts, un){
  if(pts.length<2) return `<p class="muted small" style="margin:10px 0 0">Registre o peso pelo menos 2 vezes para ver o gráfico. Vale a média da semana, não o dia.</p>`;
  const W=320,H=140,pl=34,pr=10,pt=12,pb=22;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs), y0=Math.floor(Math.min(...ys)-0.5), y1=Math.ceil(Math.max(...ys)+0.5);
  const X=v=>pl+(x1===x0?0.5:(v-x0)/(x1-x0))*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const line=pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de peso">
    <line x1="${pl}" x2="${W-pr}" y1="${Y(y1)}" y2="${Y(y1)}" stroke="#2c2c30"/><line x1="${pl}" x2="${W-pr}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="#2c2c30"/>
    <text x="${pl-6}" y="${Y(y1)+4}" fill="#8a8c92" font-size="11" text-anchor="end">${y1}</text><text x="${pl-6}" y="${Y(y0)+4}" fill="#8a8c92" font-size="11" text-anchor="end">${y0}</text>
    <polygon points="${X(x0)},${Y(y0)} ${line} ${X(x1)},${Y(y0)}" fill="rgba(199,25,32,.15)"/>
    <polyline points="${line}" fill="none" stroke="#e5262e" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="#e5262e" stroke="#101010" stroke-width="2"/>
    <text x="${X(x0)}" y="${H-6}" fill="#8a8c92" font-size="11">${dataBR(x0)}</text><text x="${X(x1)}" y="${H-6}" fill="#8a8c92" font-size="11" text-anchor="end">${dataBR(x1)}</text>
  </svg>`;
}

/* ============================ AÇÕES ============================ */
function render(){
  if(!S.perfil){ $("#app").innerHTML=`<div class="top"><div class="brand">IRON <b>28</b> PRO</div></div>`+formCadastro(null,true); $("#tabs").innerHTML=""; return; }
  const v = {inicio:vInicio,treino:vTreino,biblioteca:vBiblioteca,evolucao:vEvolucao,perfil:vPerfil}[view];
  $("#app").innerHTML = v();
  $("#tabs").innerHTML = [["inicio","Início",I.home],["treino","Treinar",I.treino],["biblioteca","Biblioteca",I.lib],["evolucao","Evolução",I.evo],["perfil","Perfil",I.perfil]]
    .map(([k,l,ic])=>`<button class="${view===k?"on":""}" data-go="${k}" aria-label="${l}">${ic}<span>${l}</span></button>`).join("");
  renderTimer();
}
function go(v){ view=v; render(); window.scrollTo(0,0); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2200); }
function openSheet(html){ $("#sheet").innerHTML=`<div class="sheet-bg" data-act="fechar"><div class="sheet" data-stop>${html}</div></div>`; }
function closeSheet(){ $("#sheet").innerHTML=""; }
function confirmar(titulo, texto, botoes){ openSheet(`<div class="stack"><h2>${titulo}</h2><p class="muted" style="margin:0">${texto}</p>${botoes}<button class="btn btn-ghost" data-act="fechar">Cancelar</button></div>`); }

let wake=null;
async function pedirWake(){ try{ wake = await navigator.wakeLock?.request("screen"); }catch(e){} }

function iniciar(t, forcar){
  if(ativa()) return go("treino");
  if(t==="E" && !forcar && !PROTOCOLO.sequencia.includes("E") && !liberaE().ok) return confirmar("Treino extra ainda não","O protocolo v1.2 libera o treino E a partir da 3ª semana, só num 5º dia e depois de um treino de pernas.",`<button class="btn btn-ghost" data-act="forcarE">Fazer mesmo assim</button>`);
  const s={id:uid(),treino:t,inicio:Date.now(),fim:null,status:"andamento",log:{}};
  S.sessoes.push(s); S.ativa=s.id; if(!S.inicioCiclo) S.inicioCiclo=new Date(new Date().toDateString()).getTime();
  save(); pedirWake(); go("treino");
}
function logEx(a,id){ return a.log[id] || (a.log[id]={sets:[],pulou:null}); }

function marcaSerie(id,k){
  const a=ativa(); if(!a) return;
  const e=exOf(a.treino).find(x=>x.id===id), lib=EXS[id], r=logEx(a,id);
  const st=r.sets[k]||(r.sets[k]={});
  if(st.feito){ st.feito=false; save(); render(); return; }
  const card=document.querySelector(`input[data-ex="${id}"][data-k="${k}"][data-f="reps"]`);
  const kgIn=document.querySelector(`input[data-ex="${id}"][data-k="${k}"][data-f="kg"]`);
  const kg = kgIn ? parseFloat((kgIn.value||kgIn.placeholder).replace(",",".")) : 0;
  const reps = parseInt(card.value||card.placeholder,10);
  if(kgIn && isNaN(kg)) return toast("Coloque a carga");
  if(isNaN(reps)) return toast("Coloque as repetições");
  Object.assign(st,{kg:kgIn?kg:0,reps,feito:true,t:Date.now()});
  save();
  const ultimaSerie = k===e.series-1;
  const ehPrimeiroDoPar = e.par && !e.desc;
  if(ehPrimeiroDoPar){ toast("Agora o par, sem descanso"); }
  else if(!(ultimaSerie && exOf(a.treino).every(x=>exConcluido(a,x)))){ startTimer(e.desc, lib.n); }
  if(ultimaSerie && !e.par){ S.abertos[a.id+id]=false; const nx=exOf(a.treino).find(x=>!exConcluido(a,x)); if(nx) S.abertos[a.id+nx.id]=true; }
  render();
}

function finalizar(){
  const a=ativa(); if(!a) return;
  const exs=exOf(a.treino), done=exs.filter(e=>exConcluido(a,e)).length;
  if(done===exs.length) return fechaSessao("feito");
  confirmar("Finalizar treino?", `Você concluiu ${done} de ${exs.length} exercícios.`,
    `<button class="btn btn-red" data-act="fim" data-v="feito">Contar como feito</button>
     <button class="btn btn-ghost" data-act="fim" data-v="parcial">Não contar (repetir ${a.treino} depois)</button>`);
}
function fechaSessao(status){
  const a=ativa(); a.fim=Date.now(); a.status=status; S.ativa=null; S.timer=null; save(); closeSheet();
  try{ wake?.release(); }catch(e){}
  toast(status==="feito"? `Treino ${a.treino} concluído 💪` : "Salvo. A sequência não avançou.");
  go("inicio");
}

/* Cronômetro: baseado em horário absoluto (continua certo se o app for para segundo plano) */
function startTimer(sec,label){ if(!sec) return; S.timer={fim:Date.now()+sec*1000,total:sec,label,avisou:false}; save(); renderTimer(); }
function renderTimer(){
  const el=$("#timer"), t=S.timer;
  if(!t){ el.innerHTML=""; return; }
  const rest=(t.fim-Date.now())/1000, over=rest<=0;
  el.innerHTML=`<div class="timer ${over?"over":""}" role="timer"><div class="in">
    <div class="t num">${over?"+"+mmss(-rest):mmss(rest)}</div>
    <div class="grow small"><div class="lbl" style="color:${over?"var(--green)":"var(--steel-hi)"}">${over?"Pode ir! Próxima série":"Descanso"}</div><div class="ellip muted">${esc(t.label)}</div></div>
    ${over?"":`<button class="tb" data-act="menos15">−15</button><button class="tb" data-act="mais15">+15</button>`}<button class="tb" data-act="pulaTimer">${over?"OK":"Pular"}</button>
  </div></div>`;
  if(over && !t.avisou){ t.avisou=true; save(); bip(); try{navigator.vibrate?.([200,100,200]);}catch(e){} }
}
let actx=null;
function bip(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.15);}); }catch(e){} }
setInterval(()=>{ if(S.timer) renderTimer(); const el=$("#elap"), a=ativa(); if(el&&a) el.textContent=mmss((Date.now()-a.inicio)/1000); },500);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ renderTimer(); if(ativa()) pedirWake(); } });

/* ===== Animações próprias (SVG): certo × errado ===== */

    const head=[sh[0]+10*Math.sin(tr)+ (bad?8*p:0), sh[1]-20];
    const bar=[sh[0]-2, sh[1]-4];
    // costas: reta no certo, curva no erro
    const mid=[(hip[0]+sh[0])/2, (hip[1]+sh[1])/2];
    const bulge = bad ? 16*p : 0;
    const ctrl=[mid[0]-bulge*Math.cos(tr), mid[1]-bulge*Math.sin(tr)];

    let g = `<line x1="20" y1="236" x2="180" y2="236" stroke="#2c2c30" stroke-width="3"/>`;
    g += `<line x1="${bar[0]}" y1="20" x2="${bar[0]}" y2="234" stroke="#2a2a2e" stroke-width="5"/>`;                 // trilho da barra guiada
    g += `<circle cx="${bar[0]-6}" cy="${bar[1]}" r="15" fill="#1a1a1d" stroke="${dim}" stroke-width="4"/><circle cx="${bar[0]-6}" cy="${bar[1]}" r="3.5" fill="${dim}"/>`;   // anilha atrás do corpo
    if(!bad) g += `<line x1="${hip[0]}" y1="${hip[1]}" x2="${sh[0]}" y2="${sh[1]}" stroke="${G}" stroke-width="2" stroke-dasharray="5 4" transform="translate(-14 0)"/>`;
    g += `<path d="M${ank[0]-6} ${ank[1]+4} L${toe[0]} ${toe[1]}" stroke="${body}" stroke-width="9" stroke-linecap="round"/>`;
    g += seg(ank,knee,body);

    g += `<path d="M${hip[0]} ${hip[1]} Q${ctrl[0]} ${ctrl[1]} ${sh[0]} ${sh[1]}" stroke="${bad?Rd:body}" stroke-width="15" fill="none" stroke-linecap="round"/>`;
    g += `<circle cx="${head[0]}" cy="${head[1]}" r="12" fill="${body}"/>`;
    g += seg(sh,[sh[0]+14,sh[1]+14],body,10) + seg([sh[0]+14,sh[1]+14],[bar[0]+6,bar[1]+2],body,9);
    if(bad){ g += glow(ctrl,Rd,17); if(heel>2) g += glow([ank[0]-4,ank[1]+2],Rd,11); }

    return g;
  }
};

/* Backup */
DB.all = async function(){ const d=await this.open(); return new Promise(ok=>{ const out=[]; const c=d.transaction("m").objectStore("m").openCursor(); c.onsuccess=()=>{ const r=c.result; if(r){ out.push([r.key,r.value]); r.continue(); } else ok(out); }; c.onerror=()=>ok(out); }); };
const toDataURL = b => new Promise(ok=>{ const f=new FileReader(); f.onload=()=>ok(f.result); f.readAsDataURL(b); });
async function exportar(){
  const comVideos = !!$("#bkv")?.checked;
  const midia = {};
  if(comVideos){ try{ for(const [k,v] of await DB.all()) midia[k]=await toDataURL(v); }catch(e){} }
  const data=JSON.stringify({app:"IRON 28 PRO",formato:2,versaoApp:APP_VERSAO,exportado:new Date().toISOString(),protocolo:PROTOCOLO.versao,dados:S,midia});
  S.ultimoBackup=Date.now(); save();
  const nome="iron28pro-backup-"+new Date().toISOString().slice(0,10)+".json";
  window._bkTxt = data.length<2e6 ? data : "Backup grande (com vídeos): use o arquivo salvo.";
  try{
    const file=new File([data],nome,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Backup IRON 28 PRO"}); toast("Escolha “Salvar em Arquivos”"); return render(); }
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=nome; a.click();
  }catch(e){}
  toast("Backup pronto"); render();
}
async function importar(txt){
  try{ const j=JSON.parse(txt); if(j.app!=="IRON 28 PRO"||!j.dados) throw 0;
    S=Object.assign(blank(),j.dados); _tinhaDados=true; aposCarregar(); save();
    let n=0; for(const [k,u] of Object.entries(j.midia||{})){ try{ const b=await (await fetch(u)).blob(); await DB.put(k,b); n++; }catch(e){} }
    toast("Backup restaurado"+(n?` · ${n} vídeo(s)`:"")); go("inicio"); }
  catch(e){ toast("Esse texto não é um backup válido do IRON 28 PRO"); }
}

  const g=ev.target.closest("[data-go]"); if(g){ closeSheet(); return go(g.dataset.go); }

  if(el.classList.contains("sheet-bg") && ev.target.closest("[data-stop]")) return;
  const d=el.dataset, a=ativa();

    case "pularMotivo": logEx(a,d.ex).pulou=d.v; save(); closeSheet(); if(d.v==="Dor ou desconforto") toast("Dor forte ou estranha: pare e procure avaliação."); render(); break;
    case "despular": logEx(a,d.ex).pulou=null; save(); render(); break;

      const p=parseFloat(($("#inPeso").value||"").replace(",",".")), c=parseFloat(($("#inCint").value||"").replace(",","."));
      if(isNaN(p)&&isNaN(c)) return toast("Coloque o peso ou a cintura");
      S.corpo.push({d:Date.now(),peso:isNaN(p)?null:p,cintura:isNaN(c)?null:c}); save(); toast("Medida salva"); render(); break; }
    case "sono": S.sono=(S.sono||[]).filter(x=>x.d!==hoje()); S.sono.push({d:hoje(),t:Date.now(),h:+d.v}); save(); toast(+d.v<6?"Anotado. Priorize dormir mais cedo hoje":"Anotado 💪"); render(); break;
    case "rmMidia": DB.del(d.k).then(()=>sheetLib(d.k.split(":")[0])); break;
    case "iglink": openSheet(`<div class="stack"><h2>Link do Instagram</h2><p class="muted small" style="margin:0">No Instagram: ⋯ → Copiar link. Cole aqui.</p><label class="field"><span class="lbl">Link do post</span><input id="igIn" inputmode="url" value="${esc(S.ig?.[d.ex]||"")}" placeholder="https://www.instagram.com/reel/..."></label><button class="btn btn-red" data-act="igSalvar" data-ex="${d.ex}">Salvar</button><button class="btn btn-ghost" data-act="fechar">Cancelar</button></div>`); break;
    case "igSalvar": { const v=$("#igIn").value.trim(); if(v && !/^https:\/\/(www\.)?instagram\.com\//.test(v)) return toast("Cole um link do instagram.com"); S.ig=S.ig||{}; if(v) S.ig[d.ex]=v; else delete S.ig[d.ex]; save(); toast("Link salvo"); sheetLib(d.ex); break; }
    case "criador": { const v=($("#criIn").value||"").trim().replace(/^@/,""); S.criador=v||"pedrolotz"; save(); toast("Criador salvo"); break; }
    case "editSess": { const s=S.sessoes.find(z=>z.id===d.id); if(!s) break;
      const linhas = exOf(s.treino).filter(e=>s.log[e.id]?.sets?.some(z=>z.feito)).map(e=>`<div class="stack" style="gap:6px"><b>${esc(EXS[e.id].n)}</b>${s.log[e.id].sets.map((z,k)=>z.feito?`<div class="row"><span class="num" style="width:22px;font-family:var(--f-display);font-weight:800;color:var(--steel)">${k+1}</span><input class="grow" style="height:44px;border-radius:10px;border:1px solid var(--line);background:#0c0c0d;text-align:center;font-size:17px;min-width:0" inputmode="decimal" data-ed="${s.id}|${e.id}|${k}|kg" value="${z.kg}" aria-label="Carga"><span class="muted">×</span><input class="grow" style="height:44px;border-radius:10px;border:1px solid var(--line);background:#0c0c0d;text-align:center;font-size:17px;min-width:0" inputmode="numeric" data-ed="${s.id}|${e.id}|${k}|reps" value="${z.reps}" aria-label="Repetições"><button class="chk" data-act="delSerie" data-k="${s.id}|${e.id}|${k}" aria-label="Apagar série">🗑</button></div>`:"").join("")}</div>`).join("");
      openSheet(`<div class="stack"><div class="row between"><h2>Corrigir treino ${s.treino}</h2><button class="pill" data-act="fechar">Fechar</button></div><div class="small muted">${dataBR(s.inicio)} · as mudanças salvam sozinhas</div>${linhas||'<p class="muted">Nenhuma série registrada.</p>'}</div>`); break; }
    case "delSerie": { const [sid,ex,k]=d.k.split("|"); const s=S.sessoes.find(z=>z.id===sid); if(s){ s.log[ex].sets[+k].feito=false; save(); toast("Série apagada"); closeSheet(); render(); } break; }
    case "verTreino": { const t=d.t, T=PROTOCOLO.treinos[t], exs=exOf(t), a=ativa(), nx=proximo();
      openSheet(`<div class="stack"><div class="row between"><div class="row"><div class="badge red">${t}</div><h2>${T.nome}</h2></div><button class="pill" data-act="fechar">Fechar</button></div>
        <div class="small muted">${T.foco} · ${exs.reduce((n,e)=>n+e.series,0)} séries · ≈ ${T.min} min</div>
        <div class="card list" style="padding:4px 14px">${exs.map((e,i)=>`<button class="li" data-act="lib" data-ex="${e.id}"><div class="badge">${i+1}</div><div class="grow"><b>${esc(EXS[e.id].n)}</b><div class="small muted num">${e.series} × ${e.min}–${e.max} · ⏱ ${e.desc?mmss(e.desc):"sem pausa"}</div></div><span class="muted">▶</span></button>`).join("")}</div>
        ${a?`<p class="small muted" style="margin:0">Termine o treino ${a.treino} em andamento antes de começar outro.</p>`:`<button class="btn btn-red" data-act="iniciarSheet" data-t="${t}">Iniciar treino ${t}</button>${t!==nx?`<p class="small muted" style="margin:0">Fora da ordem: o próximo era o ${nx}. Se fizer o ${t}, depois vem o ${PROTOCOLO.sequencia[(PROTOCOLO.sequencia.indexOf(t)+1)%4]}.</p>`:""}`}
      </div>`); break; }
    case "iniciarSheet": closeSheet(); iniciar(d.t); break;
    case "prim": S.primeiro=d.v; save(); render(); break;
    case "exportar": exportar(); break;
    case "copiar": { const t=$("#bk"); if(!t.value) exportar(); navigator.clipboard?.writeText(t.value).then(()=>toast("Copiado"),()=>{t.select();toast("Selecionado: copie manualmente");}); break; }
    case "importar": importar($("#bk").value); break;
    case "zerar": confirmar("Apagar tudo?","Todos os treinos e medidas deste aparelho serão apagados. Faça um backup antes.",`<button class="btn btn-red" data-act="zerarSim">Apagar tudo</button>`); break;
    case "segSel": el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el)); break;
    case "cadSalvar": salvarCadastro(!!d.primeira); break;
    case "cadEditar": openSheet(formCadastro(S.perfil,false)); break;
    case "regerar": if(ativa()){ closeSheet(); return toast("Termine o treino em andamento antes"); } { const nv=gerarPlano(S.perfil); if(JSON.stringify(nv??null)===JSON.stringify(S.plano??null)){ S._objPlano=S.perfil.objetivo; save(); closeSheet(); go("inicio"); toast("Os exercícios continuam iguais. Mudou a meta de cardio."); break; } aplicarPlano(nv); closeSheet(); go("inicio"); toast("Treino novo montado 💪"); } break;
    case "fecharRender": closeSheet(); render(); toast("Cadastro salvo"); break;
    case "trocar": sheetTrocar(d.base,d.t); break;
    case "planoVolta": if(ativa()) return toast("Termine o treino em andamento antes"); voltarPlano(S.planoAnterior); render(); toast("Treino anterior restaurado"); break;
    case "planoOrig": if(ativa()) return toast("Termine o treino em andamento antes"); confirmar("Usar o plano original?","O treino atual fica guardado em “Voltar ao treino anterior”. O histórico não muda.",`<button class="btn btn-red" data-act="planoOrigSim">Sim, usar o original</button>`); break;
    case "planoOrigSim": voltarPlano({plano:S.planoOriginal??null,trocas:{},objetivo:S.perfil&&S.perfil.objetivo}); closeSheet(); render(); toast("Plano original restaurado"); break;
    case "cardio": sheetCardio(); break;
    case "cdSel": el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===el)); window._cd[d.g]=d.g==="min"?+d.v:d.v; break;
    case "cardioSalvar": (S.cardio=S.cardio||[]).push({t:Date.now(),tipo:window._cd.tipo,min:window._cd.min}); save(); closeSheet(); render(); toast("Cardio salvo 🚶"); break;
    case "relatorio": sheetRelatorio(28); break;
    case "relPer": sheetRelatorio(+d.v); break;
    case "relShare": if(navigator.share) navigator.share({title:"Relatório IRON 28 PRO",text:window._relTxt}).catch(()=>{}); else { navigator.clipboard?.writeText(window._relTxt); toast("Relatório copiado"); } break;
    case "relCopy": try{ navigator.clipboard.writeText(window._relTxt).then(()=>toast("Relatório copiado")); }catch(e){ toast("Não deu para copiar"); } break;
    case "trocaMot": sheetAlternativas(d.base,d.t,d.v); break;
    case "trocaSel": trocar(d.base,d.v,d.mot); break;
    case "zerarSim": S=blank(); PROTOCOLO=PROTO_BASE; save(); closeSheet(); toast("Dados apagados"); go("inicio"); break;
  }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="libQ"){ window._libQ=ev.target.value; const l=$("#libList"); if(l) l.innerHTML=listaLib(); } });
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.ed){ const [sid,ex,k,f]=t.dataset.ed.split("|"); const s=S.sessoes.find(z=>z.id===sid); const v=parseFloat(t.value.replace(",",".")); if(s && !isNaN(v)){ s.log[ex].sets[+k][f]=v; save(); toast("Corrigido"); } return; }
  if(t.dataset.midia && t.files[0]){ const f=t.files[0]; if(f.size>80*1024*1024) return toast("Vídeo muito grande (máx. 80 MB)"); DB.put(t.dataset.midia,f).then(()=>{toast("Vídeo salvo neste aparelho"); sheetLib(t.dataset.midia.split(":")[0]);}).catch(()=>toast("Não deu para salvar o vídeo aqui")); return; }
  if(t.id==="fotoIn" && t.files[0]){ abrirRecorte(t.files[0]); t.value=""; return; }
  if(t.id==="bkf" && t.files[0]){ t.files[0].text().then(importar); return; }
  if(!t.dataset.f) return;
  const a=ativa(); if(!a) return;
  const st=(logEx(a,t.dataset.ex).sets[+t.dataset.k] ||= {});
  const v=parseFloat(t.value.replace(",","."));
  st[t.dataset.f]=isNaN(v)?undefined:v; save();
});

if(ativa()) view="treino";
render();
if("serviceWorker" in navigator && location.protocol==="https:" && document.querySelector('link[rel="manifest"]')){
  const tinha = !!navigator.serviceWorker.controller; let recarregou=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(tinha && !recarregou && !ativa()){ recarregou=true; location.reload(); } });
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{ r.update(); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) r.update(); }); }).catch(()=>{});
}
</script>
